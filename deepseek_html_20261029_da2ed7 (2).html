<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>记账看板</title>
<style>
:root{--bg:#eaf7ef;--card:#fff;--primary:#6cc399;--light:#b7e4cd;--text:#333;--sub:#888;--red:#e89469}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,sans-serif;background:var(--bg);color:var(--text);padding-bottom:80px}
body.modal-open{overflow:hidden}
.app{max-width:500px;margin:0 auto;background:linear-gradient(180deg,#eaf7ef 0%,#f8fbf9 20%,#f8fbf9 100%);min-height:100vh}
.header{display:flex;align-items:center;justify-content:space-between;padding:16px;background:#8fcca8;color:#fff;border-radius:0 0 20px 20px;position:sticky;top:0;z-index:10}
.header-title{font-size:17px;font-weight:500}
.header-btn{font-size:14px;background:rgba(255,255,255,0.2);padding:4px 10px;border-radius:12px;cursor:pointer}
.seg-control{display:flex;background:#eaf7ef;border-radius:20px;padding:4px;width:200px;margin:16px auto 0}
.seg-control button{flex:1;border:none;background:transparent;padding:6px 0;border-radius:16px;font-size:14px;color:var(--primary);font-weight:500;cursor:pointer}
.seg-control button.active{background:var(--primary);color:#fff}
.top-stats{padding:16px}
.date-selector{display:flex;justify-content:center;align-items:center;gap:20px;margin-bottom:16px;font-size:16px;color:var(--primary);font-weight:600}
.arrow-btn{width:24px;height:24px;background:var(--light);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;cursor:pointer}
.stat-cards{display:flex;gap:12px}
.stat-card{flex:1;border-radius:16px;padding:16px;border:1px solid var(--light);background:var(--card);display:flex;flex-direction:column;justify-content:center}
.stat-card.expense{background:linear-gradient(135deg,#a8dcbf 0%,#84cba6 100%);border:none;color:#fff}
.stat-amt{font-size:20px;font-weight:700;margin-bottom:4px}
.stat-label{font-size:12px}
.card{background:var(--card);border-radius:16px;margin:0 16px 16px;padding:16px;border:1px solid var(--light);position:relative}
.card::before{content:'';position:absolute;top:6px;left:6px;right:6px;bottom:6px;border:1px dashed var(--light);border-radius:12px;pointer-events:none}
.card-title{font-size:16px;font-weight:700;margin-bottom:12px;display:inline-block;background:#fdf3d9;padding:2px 8px;border-radius:4px;position:relative;z-index:1}
.trend-info{margin-bottom:16px}.trend-highlight{font-size:13px;line-height:1.5}
.trend-highlight span{color:#ef4444;font-weight:600}
.trend-sub-info{display:flex;gap:24px;margin-bottom:20px;font-size:12px}
.trend-sub-item p:first-child{color:var(--sub);margin-bottom:4px}
.trend-sub-item p:last-child{font-size:15px;font-weight:600}
.chart-container{width:100%;height:180px;position:relative}
#dayDetail{border-top:1px dashed var(--light);margin-top:16px;padding-top:16px;display:none;}
.donut-container{width:100%;height:220px;display:flex;justify-content:center;align-items:center}
.rank-list{display:flex;flex-direction:column;gap:16px}
.rank-item{display:flex;align-items:center;gap:12px}
.rank-icon{width:44px;height:44px;border-radius:50%;background:#f8f9fb;display:flex;align-items:center;justify-content:center;font-size:20px;border:1px solid #eaeaea}
.rank-content{flex:1}.rank-header{display:flex;justify-content:space-between;margin-bottom:6px;font-size:14px}
.rank-bar-bg{height:6px;background:#f0f0f0;border-radius:3px;overflow:hidden;margin-bottom:4px}
.rank-bar{height:100%;border-radius:3px}
.rank-footer{display:flex;justify-content:space-between;font-size:11px;color:var(--sub)}
.fab{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);width:56px;height:56px;border-radius:28px;background:var(--primary);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(108,195,153,0.4);border:none;cursor:pointer;z-index:20}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:50;display:none;opacity:0;transition:opacity 0.3s}
.modal-overlay.show{display:block;opacity:1}
.modal-content{position:fixed;bottom:0;left:0;right:0;max-width:500px;margin:0 auto;background:#fff;border-radius:20px 20px 0 0;padding:20px;transform:translateY(100%);transition:transform 0.3s;z-index:51;max-height:80vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.modal-content.show{transform:translateY(0)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-title{font-size:18px;font-weight:600}.close-btn{font-size:24px;color:#999;cursor:pointer}
.form-group{margin-bottom:14px}.form-group label{display:block;font-size:13px;color:#666;margin-bottom:6px}
.form-control{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:15px;outline:none}
.type-switch{display:flex;gap:10px;margin-bottom:14px}
.type-btn{flex:1;padding:10px;border-radius:10px;border:1px solid #ddd;background:#f8f9fb;font-size:14px;color:#666}
.type-btn.active[data-type="expense"]{background:#fee2e2;border-color:#ef4444;color:#ef4444;font-weight:600}
.type-btn.active[data-type="income"]{background:#d1fae5;border-color:#10b981;color:#10b981;font-weight:600}
.cat-selector{display:flex;flex-wrap:wrap;gap:8px}
.cat-btn{padding:6px 12px;border-radius:16px;border:1px solid #ddd;background:#fff;font-size:13px;color:#666}
.cat-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
.submit-btn{width:100%;padding:14px;border-radius:12px;background:var(--primary);color:#fff;font-size:16px;font-weight:600;border:none;margin-top:10px}
.txn-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #f0f0f0}
.txn-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
.txn-main{flex:1;min-width:0}.txn-cat{font-size:14px;font-weight:500}
.txn-note{font-size:12px;color:#999;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txn-date{font-size:12px;color:#999}.txn-amt{font-size:15px;font-weight:600;width:75px;text-align:right}
.txn-amt.expense{color:#ef4444}.txn-amt.income{color:#10b981}
.txn-del{background:none;border:none;color:#ccc;font-size:16px;padding:4px}
.empty{text-align:center;padding:30px;color:#999;font-size:14px}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-btn" id="btnOpenList">明细</div>
    <div class="header-title">记账看板</div>
    <div class="header-btn" id="btnOpenAdd">记一笔</div>
  </div>
  
  <div class="seg-control">
    <button class="active" data-period="week">周</button>
    <button data-period="month">月</button>
    <button data-period="year">年</button>
  </div>
  
  <div class="top-stats">
    <div class="date-selector">
      <div class="arrow-btn" id="btnPrev">◀</div>
      <span id="dateText">2026年10月</span>
      <div class="arrow-btn" id="btnNext">▶</div>
    </div>
    <div class="stat-cards">
      <div class="stat-card expense">
        <div class="stat-amt" id="statExpense">¥0.00</div>
        <div class="stat-label">总支出</div>
      </div>
      <div class="stat-card income">
        <div class="stat-amt" id="statIncome">¥0.00</div>
        <div class="stat-label">总收入</div>
      </div>
    </div>
  </div>
  
  <div class="card">
    <div class="card-title">支出趋势</div>
    <div class="trend-info">
      <div class="trend-highlight" id="trendHighlight">暂无数据</div>
    </div>
    <div class="trend-sub-info">
      <div class="trend-sub-item"><p>平均每日支出</p><p id="avgDaily">¥0.00</p></div>
      <div class="trend-sub-item"><p>累计支出笔数</p><p id="totalCount">0笔</p></div>
    </div>
    <div class="chart-container" id="lineChart"></div>
    
    <div id="dayDetail"></div>
  </div>
  
  <div class="card">
    <div class="card-title">支出占比概况</div>
    <div class="donut-container" id="donutChart"></div>
  </div>
  <div class="card">
    <div class="card-title">支出类目排行</div>
    <div class="rank-list" id="rankList"></div>
  </div>
</div>

<button class="fab" id="fabAdd">+</button>
<div class="modal-overlay" id="overlay"></div>
<div class="modal-content" id="addModal">
  <div class="modal-header"><div class="modal-title">记一笔</div><div class="close-btn" id="btnCloseAdd">×</div></div>
  <div class="type-switch">
    <button class="type-btn active" data-type="expense">支出</button>
    <button class="type-btn" data-type="income">收入</button>
  </div>
  <div class="form-group"><label>金额</label><input type="number" class="form-control" id="inputAmount" placeholder="0.00" step="0.01" inputmode="decimal"></div>
  <div class="form-group"><label>分类</label><div class="cat-selector" id="catSelector"></div></div>
  <div class="form-group"><label>日期</label><input type="date" class="form-control" id="inputDate"></div>
  <div class="form-group"><label>备注 (可选)</label><input type="text" class="form-control" id="inputNote" placeholder="买了一杯咖啡"></div>
  <button class="submit-btn" id="btnSave">保存</button>
</div>
<div class="modal-content" id="listModal">
  <div class="modal-header"><div class="modal-title" id="listTitle">交易明细</div><div class="close-btn" id="btnCloseList">×</div></div>
  <div class="txn-list" id="txnList" style="max-height:55vh;overflow-y:auto;"></div>
</div>

<script>
const EXPENSE_CATS = {'餐饮':{icon:'🍚',color:'#8ba7ea'},'旅行':{icon:'✈️',color:'#e89469'},'宠物':{icon:'🐶',color:'#f4cd7a'},'水果':{icon:'🍉',color:'#b7e4cd'},'交通':{icon:'🚗',color:'#b591e8'},'购物':{icon:'🛍️',color:'#eaa2c4'},'居住':{icon:'🏠',color:'#9dd1e8'},'其他':{icon:'📦',color:'#94a3b8'}};
const INCOME_CATS = {'工资':{icon:'💰',color:'#10b981'},'奖金':{icon:'🎁',color:'#22c55e'},'理财':{icon:'📈',color:'#0ea5e9'},'兼职':{icon:'💼',color:'#84cc16'},'其他':{icon:'💵',color:'#94a3b8'}};

const state = {txns:[], period:'week', anchorDate:new Date(), formType:'expense', formCat:'餐饮', selectedDate: null};

const formatDate = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const formatMoney = n => '¥' + Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});

function loadData(){
  const raw = localStorage.getItem('ledger_v2');
  if(raw){ try{ state.txns = JSON.parse(raw); }catch(e){} } 
  else {
    const ym = formatDate(new Date()).slice(0,7);
    state.txns = [
      {id:'1',type:'expense',amount:3360.40,category:'旅行',note:'机票',date:`${ym}-07`},
      {id:'2',type:'expense',amount:280,category:'餐饮',note:'聚餐',date:`${ym}-06`},
      {id:'3',type:'expense',amount:1023.56,category:'餐饮',note:'日常饮食',date:`${ym}-15`}
    ];
    saveData();
  }
}
function saveData(){ localStorage.setItem('ledger_v2', JSON.stringify(state.txns)); }

function getFilteredData(){
  const a = state.anchorDate, y = a.getFullYear(), m = a.getMonth(), d = a.getDate();
  let start, end;
  if(state.period === 'month'){ start = new Date(y,m,1); end = new Date(y,m+1,0); }
  else if(state.period === 'year'){ start = new Date(y,0,1); end = new Date(y,11,31); }
  else { const day = a.getDay()||7; start = new Date(y,m,d-day+1); end = new Date(y,m,d-day+7); }
  const sStr = formatDate(start), eStr = formatDate(end);
  return { list: state.txns.filter(t=>t.date>=sStr && t.date<=eStr), start, end };
}

function renderDashboard(){
  const {list,start,end} = getFilteredData();
  let title = state.period==='month' ? `${start.getFullYear()}年${start.getMonth()+1}月` : state.period==='year' ? `${start.getFullYear()}年` : `${start.getMonth()+1}月${start.getDate()}日-${end.getMonth()+1}月${end.getDate()}日`;
  document.getElementById('dateText').textContent = title;
  document.getElementById('listTitle').textContent = `交易明细 (${title})`;

  let tExp = 0, tInc = 0;
  list.forEach(t => { if(t.type==='expense') tExp+=t.amount; else tInc+=t.amount; });
  document.getElementById('statExpense').textContent = formatMoney(tExp);
  document.getElementById('statIncome').textContent = formatMoney(tInc);

  let chartData = [], tDays = 1;
  
  if(state.period === 'month'){
    tDays = end.getDate();
    for(let i=1; i<=tDays; i++){
      const ds = `${start.getFullYear()}-${String(start.getMonth()+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
      chartData.push({ label: i, dateStr: ds, amount: list.filter(t=>t.type==='expense'&&t.date===ds).reduce((s,t)=>s+t.amount,0) });
    }
  } else if(state.period === 'year'){
    tDays = 12;
    for(let i=1; i<=12; i++){
      const ms = `${start.getFullYear()}-${String(i).padStart(2,'0')}`;
      chartData.push({ label: i+'月', dateStr: ms, amount: list.filter(t=>t.type==='expense'&&t.date.startsWith(ms)).reduce((s,t)=>s+t.amount,0) });
    }
  } else {
    tDays = 7;
    for(let i=0; i<7; i++){
      const cur = new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);
      const ds = formatDate(cur);
      chartData.push({ label: ['一','二','三','四','五','六','日'][i], dateStr: ds, amount: list.filter(t=>t.type==='expense'&&t.date===ds).reduce((s,t)=>s+t.amount,0) });
    }
  }

  const expList = list.filter(t=>t.type==='expense');
  const maxItem = [...expList].sort((a,b)=>b.amount-a.amount)[0];
  document.getElementById('trendHighlight').innerHTML = maxItem ? `本期最高支出<br>在${maxItem.date.slice(5).replace('-','.')}这一天，你支出了<span>${formatMoney(maxItem.amount)}</span>` : '本期暂无支出记录';
  document.getElementById('avgDaily').textContent = formatMoney(tExp/tDays);
  document.getElementById('totalCount').textContent = expList.length + '笔';

  renderLineChart(chartData);
  renderDonutAndRank(expList, tExp);
  renderTxnList(list, title);
  renderDayDetail(list);
}

function renderLineChart(data){
  const c = document.getElementById('lineChart'), w = c.clientWidth||300, h = 180;
  const p = {top:30,right:10,bottom:20,left:40}, cw = w-p.left-p.right, ch = h-p.top-p.bottom;
  const maxV = Math.max(...data.map(d=>d.amount),100), yMax = Math.ceil(maxV/500)*500;
  const pts = data.map((d,i)=>({x:p.left+(i/Math.max(1,data.length-1))*cw, y:p.top+ch-(d.amount/yMax)*ch, ...d}));
  
  let pathD = `M ${pts[0].x} ${pts[0].y}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i===0?0:i-1], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    pathD += ` C ${p1.x+(p2.x-p0.x)/6} ${p1.y+(p2.y-p0.y)/6}, ${p2.x-(p3.x-p1.x)/6} ${p2.y-(p3.y-p1.y)/6}, ${p2.x} ${p2.y}`;
  }
  
  let svg = `<svg width="100%" height="100%" viewBox="0 0 ${w} ${h}">`;
  for(let i=0;i<=4;i++){
    const y = p.top+(ch/4)*i, val = yMax-(yMax/4)*i;
    svg += `<line x1="${p.left}" y1="${y}" x2="${w-p.right}" y2="${y}" stroke="#f0f0f0"/><text x="${p.left-5}" y="${y+4}" fill="#b0b0b0" font-size="10" text-anchor="end">${val}</text>`;
  }
  
  // 确定当前要高亮展示的点
  let activePt = state.selectedDate ? pts.find(pt => pt.dateStr === state.selectedDate) : null;
  if (!activePt) {
    activePt = pts.reduce((pr,cu)=>pr.amount>cu.amount?pr:cu, pts[0]);
  }

  // 绘制垂直虚线
  if (activePt) {
    svg += `<line x1="${activePt.x}" y1="${p.top}" x2="${activePt.x}" y2="${p.top+ch}" stroke="#e89469" stroke-dasharray="4" opacity="0.5"/>`;
  }

  svg += `<path d="${pathD}" fill="none" stroke="#e89469" stroke-width="2"/>`;
  
  const step = Math.ceil(data.length/6);
  pts.forEach((pt,i)=>{
    if(i%step===0 || i===data.length-1) {
      svg += `<text x="${pt.x}" y="${h-4}" fill="#b0b0b0" font-size="10" text-anchor="middle">${pt.label}</text>`;
    }
    
    // 点击热区
    svg += `<circle cx="${pt.x}" cy="${pt.y}" r="15" fill="transparent" class="chart-point-hit" data-date="${pt.dateStr}" style="cursor:pointer;" />`;
    
    // 绘制圆点
    if (pt === activePt) {
      svg += `<circle cx="${pt.x}" cy="${pt.y}" r="5" fill="#fff" stroke="#e89469" stroke-width="3"/>`;
    } else {
      svg += `<circle cx="${pt.x}" cy="${pt.y}" r="2.5" fill="#fff" stroke="#e89469" stroke-width="1.5"/>`;
    }
  });

  // 绘制气泡 Tooltip (仅在金额大于0时显示)
  if(activePt && activePt.amount > 0) {
    let tipW = 82, tipH = 30;
    let tipX = activePt.x - tipW / 2;
    let tipY = activePt.y - tipH - 12; // 在点上方
    
    // 防止超出左右边界
    if(tipX < p.left) tipX = p.left;
    if(tipX + tipW > w - p.right) tipX = w - p.right - tipW;
    
    svg += `
      <g transform="translate(${tipX}, ${tipY})">
        <rect width="${tipW}" height="${tipH}" rx="6" fill="#666" opacity="0.85"/>
        <text x="${tipW/2}" y="19" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">${formatMoney(activePt.amount)}</text>
        <polygon points="${activePt.x - tipX - 6},${tipH} ${activePt.x - tipX + 6},${tipH} ${activePt.x - tipX},${tipH+8}" fill="#666" opacity="0.85"/>
      </g>
    `;
  }
  
  c.innerHTML = svg + `</svg>`;
}

function renderDayDetail(list) {
  const el = document.getElementById('dayDetail');
  if (!state.selectedDate) {
    el.style.display = 'none';
    return;
  }
  el.style.display = 'block';
  
  let dayTxns = [];
  let title = '';
  if (state.selectedDate.length === 7) {
    dayTxns = list.filter(t => t.date.startsWith(state.selectedDate));
    title = `${state.selectedDate.replace('-', '年')}月明细`;
  } else {
    dayTxns = list.filter(t => t.date === state.selectedDate);
    title = `${Number(state.selectedDate.slice(5,7))}月${Number(state.selectedDate.slice(8,10))}日明细`;
  }
  
  let inc = 0, exp = 0;
  dayTxns.forEach(t => {
    if (t.type === 'expense') exp += t.amount;
    else inc += t.amount;
  });
  
  let html = `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
    <div style="font-size:14px; font-weight:600;">${title} <span style="font-size:11px; color:var(--sub); font-weight:normal; margin-left:4px;">点击同一点可收起</span></div>
    <div style="font-size:12px; color:var(--sub); font-weight:500;">支:${formatMoney(exp)} 收:${formatMoney(inc)}</div>
  </div>`;
  
  if (!dayTxns.length) {
    el.innerHTML = html + `<div class="empty" style="padding:10px 0; font-size:13px;">当天没有记录</div>`;
    return;
  }
  
  html += `<div style="max-height:200px; overflow-y:auto; -webkit-overflow-scrolling:touch;">`;
  html += dayTxns.map(t => {
    const isE = t.type==='expense';
    const cInfo = isE?(EXPENSE_CATS[t.category]||EXPENSE_CATS['其他']):(INCOME_CATS[t.category]||INCOME_CATS['其他']);
    return `<div class="txn-item" style="padding:8px 0;"><div class="txn-icon" style="background:${cInfo.color}22;color:${cInfo.color}; width:32px; height:32px; font-size:12px;">${cInfo.icon}</div><div class="txn-main"><div class="txn-cat">${t.category}</div>${t.note?`<div class="txn-note">${t.note}</div>`:''}</div><div class="txn-amt ${isE?'expense':'income'}" style="font-size:14px;">${isE?'-':'+'}${formatMoney(t.amount)}</div><button class="txn-del" data-id="${t.id}" style="font-size:14px; color:#ccc;">✕</button></div>`;
  }).join('');
  html += `</div>`;
  el.innerHTML = html;
}

function renderDonutAndRank(expList, tExp){
  const dC = document.getElementById('donutChart'), rC = document.getElementById('rankList');
  const map = {};
  expList.forEach(t=>{ if(!map[t.category]) map[t.category]={amount:0,count:0}; map[t.category].amount+=t.amount; map[t.category].count++; });
  const arr = Object.keys(map).map(n=>({name:n,amount:map[n].amount,count:map[n].count,...(EXPENSE_CATS[n]||EXPENSE_CATS['其他'])})).sort((a,b)=>b.amount-a.amount);
  
  if(tExp===0){ dC.innerHTML = `<div class="empty">暂无支出</div>`; rC.innerHTML = `<div class="empty">暂无排行</div>`; return; }
  const w = dC.clientWidth||300, h = 220, cx = w/2, cy = h/2, r = 60, sw = 30;
  let ang = -Math.PI/2, paths = '', labels = '';
  arr.forEach((cat,i)=>{
    const pct = cat.amount/tExp, aSize = pct*Math.PI*2, eAng = ang+aSize;
    paths += `<path d="M ${cx+r*Math.cos(ang)} ${cy+r*Math.sin(ang)} A ${r} ${r} 0 ${aSize>Math.PI?1:0} 1 ${cx+r*Math.cos(eAng)} ${cy+r*Math.sin(eAng)}" fill="none" stroke="${cat.color}" stroke-width="${sw}"/>`;
    if(i<3 && pct>0.03){
      const mAng = ang+aSize/2, sx = cx+(r+sw/2)*Math.cos(mAng), sy = cy+(r+sw/2)*Math.sin(mAng);
      const isL = Math.cos(mAng)<0, lx = isL?sx-20:sx+20, tx = isL?lx-10:lx+10;
      labels += `<polyline points="${sx},${sy} ${lx},${sy} ${tx},${sy}" fill="none" stroke="${cat.color}"/><text x="${tx}" y="${sy-6}" fill="#888" font-size="11" text-anchor="${isL?'end':'start'}">${cat.name}</text><text x="${tx}" y="${sy+8}" fill="#333" font-size="12" font-weight="600" text-anchor="${isL?'end':'start'}">${(pct*100).toFixed(2)}%</text>`;
    }
    ang = eAng;
  });
  dC.innerHTML = `<svg width="100%" height="100%" viewBox="0 0 ${w} ${h}">${paths}${labels}<text x="${cx}" y="${cy-8}" fill="#888" font-size="11" text-anchor="middle">总支出</text><text x="${cx}" y="${cy+12}" fill="#333" font-size="14" font-weight="600" text-anchor="middle">${formatMoney(tExp)}</text></svg>`;
  
  rC.innerHTML = arr.map(c=>`<div class="rank-item"><div class="rank-icon">${c.icon}</div><div class="rank-content"><div class="rank-header"><span>${c.name}</span></div><div class="rank-bar-bg"><div class="rank-bar" style="width:${c.amount/tExp*100}%;background:${c.color}"></div></div><div class="rank-footer"><span>共支出:${c.amount.toFixed(2)}</span><span>${c.count}笔</span></div></div></div>`).join('');
}

function renderTxnList(list, titleText){
  const el = document.getElementById('txnList'), sorted = [...list].sort((a,b)=>b.date.localeCompare(a.date));
  document.getElementById('listTitle').textContent = titleText;
  
  if(!sorted.length){ el.innerHTML = '<div class="empty">暂无记录</div>'; return; }
  el.innerHTML = sorted.map(t=>{
    const isE = t.type==='expense', cInfo = isE?(EXPENSE_CATS[t.category]||EXPENSE_CATS['其他']):(INCOME_CATS[t.category]||INCOME_CATS['其他']);
    return `<div class="txn-item"><div class="txn-icon" style="background:${cInfo.color}22;color:${cInfo.color}">${cInfo.icon}</div><div class="txn-main"><div class="txn-cat">${t.category}</div>${t.note?`<div class="txn-note">${t.note}</div>`:''}</div><div class="txn-date">${t.date.slice(5)}</div><div class="txn-amt ${isE?'expense':'income'}">${isE?'-':'+'}${formatMoney(t.amount)}</div><button class="txn-del" data-id="${t.id}">✕</button></div>`;
  }).join('');
}

document.addEventListener('DOMContentLoaded', ()=>{
  loadData();
  
  document.querySelectorAll('.seg-control button').forEach(b=>b.addEventListener('click', e=>{
    document.querySelectorAll('.seg-control button').forEach(x=>x.classList.remove('active'));
    e.target.classList.add('active'); 
    state.period = e.target.dataset.period; 
    state.anchorDate = new Date(); 
    state.selectedDate = null; 
    renderDashboard();
  }));
  
  document.getElementById('btnPrev').addEventListener('click', ()=>{ 
    if(state.period==='month') state.anchorDate.setMonth(state.anchorDate.getMonth()-1);
    if(state.period==='year') state.anchorDate.setFullYear(state.anchorDate.getFullYear()-1);
    if(state.period==='week') state.anchorDate.setDate(state.anchorDate.getDate()-7); 
    state.selectedDate = null;
    renderDashboard(); 
  });
  document.getElementById('btnNext').addEventListener('click', ()=>{ 
    if(state.period==='month') state.anchorDate.setMonth(state.anchorDate.getMonth()+1);
    if(state.period==='year') state.anchorDate.setFullYear(state.anchorDate.getFullYear()+1);
    if(state.period==='week') state.anchorDate.setDate(state.anchorDate.getDate()+7); 
    state.selectedDate = null;
    renderDashboard(); 
  });

  document.getElementById('lineChart').addEventListener('click', e => {
    if(!e.target.classList.contains('chart-point-hit')) return;
    const dateStr = e.target.getAttribute('data-date');
    if(!dateStr) return;
    
    if (state.selectedDate === dateStr) {
        state.selectedDate = null;
    } else {
        state.selectedDate = dateStr;
    }
    renderDashboard();
  });

  const ov = document.getElementById('overlay'), am = document.getElementById('addModal'), lm = document.getElementById('listModal');
  const openM = m => { ov.classList.add('show'); m.classList.add('show'); document.body.classList.add('modal-open'); };
  const closeM = () => { ov.classList.remove('show'); am.classList.remove('show'); lm.classList.remove('show'); document.body.classList.remove('modal-open'); };

  document.getElementById('fabAdd').addEventListener('click', ()=>{ document.getElementById('inputDate').value = formatDate(new Date()); openM(am); });
  document.getElementById('btnOpenAdd').addEventListener('click', ()=>{ document.getElementById('inputDate').value = formatDate(new Date()); openM(am); });
  
  document.getElementById('btnOpenList').addEventListener('click', ()=>{
    const {list, start, end} = getFilteredData();
    let title = state.period==='month' ? `${start.getFullYear()}年${start.getMonth()+1}月` : state.period==='year' ? `${start.getFullYear()}年` : `${start.getMonth()+1}月${start.getDate()}日-${end.getMonth()+1}月${end.getDate()}日`;
    renderTxnList(list, `交易明细 (${title})`);
    openM(lm);
  });

  document.getElementById('btnCloseAdd').addEventListener('click', closeM);
  document.getElementById('btnCloseList').addEventListener('click', closeM);
  ov.addEventListener('click', closeM);

  document.querySelectorAll('.type-btn').forEach(b=>b.addEventListener('click', e=>{
    document.querySelectorAll('.type-btn').forEach(x=>x.classList.remove('active'));
    e.target.classList.add('active'); state.formType = e.target.dataset.type;
    const cats = state.formType==='expense'?EXPENSE_CATS:INCOME_CATS, names = Object.keys(cats);
    if(!names.includes(state.formCat)) state.formCat = names[0];
    document.getElementById('catSelector').innerHTML = names.map(n=>`<button class="cat-btn ${n===state.formCat?'active':''}" data-cat="${n}">${n}</button>`).join('');
  }));
  
  document.getElementById('catSelector').addEventListener('click', e=>{
    if(!e.target.classList.contains('cat-btn')) return;
    document.querySelectorAll('.cat-btn').forEach(x=>x.classList.remove('active'));
    e.target.classList.add('active'); state.formCat = e.target.dataset.cat;
  });

  document.getElementById('btnSave').addEventListener('click', ()=>{
    const amt = parseFloat(document.getElementById('inputAmount').value);
    if(!(amt>0)){ alert('请输入正确金额'); return; }
    const date = document.getElementById('inputDate').value || formatDate(new Date());
    state.txns.push({ id:Date.now().toString(), type:state.formType, amount:Math.round(amt*100)/100, category:state.formCat, note:document.getElementById('inputNote').value.trim(), date });
    saveData(); closeM(); document.getElementById('inputAmount').value=''; document.getElementById('inputNote').value='';
    state.anchorDate = new Date(date.replace(/-/g,'/')); 
    state.selectedDate = null; 
    renderDashboard();
  });

  document.body.addEventListener('click', e=>{
    if(!e.target.classList.contains('txn-del')) return;
    if(!confirm('确定删除？')) return;
    const id = e.target.dataset.id;
    state.txns = state.txns.filter(t=>t.id!==id); 
    saveData(); 
    renderDashboard();
  });

  document.getElementById('catSelector').innerHTML = Object.keys(EXPENSE_CATS).map(n=>`<button class="cat-btn ${n===state.formCat?'active':''}" data-cat="${n}">${n}</button>`).join('');
  renderDashboard();
});
</script>
</body>
</html>
